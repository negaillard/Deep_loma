# Локальный режим (AppMode=Local): подпись на клиенте — SigningService не нужен.
# NotificationService: почта из appsettings.json образа (без переопределения в compose).
# ClamAV — отдельный контейнер в этом стеке; API подключается по имени сервиса clamav:3310.
# DemoApp — веб-интерфейс демо: http://localhost:7082 (API: 7081).
#
#   docker compose -f docker-compose.local.yml --env-file .env up --build
#
# Миграции: .\scripts\apply-docker-migrations.ps1 -Target local (нужен dotnet-ef, см. env.example).
# Первый старт ClamAV может занять 1–2 минуты (загрузка баз сигнатур).

name: newdiplom-local

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "14334:1433"
    volumes:
      - sql-local-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 25
      start_period: 90s

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5673:5672"
      - "15673:15672"

  clamav:
    image: clamav/clamav:latest
    ports:
      - "13310:3310"

  api:
    build:
      context: .
      dockerfile: API/Dockerfile
    user: root
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DisableHttpsRedirection: "true"
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      ConnectionStrings__DefaultConnection: "Server=sql;Database=DCP_Local;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
      AppMode: Local
      CertificateMode: Local
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      FileStorage__RootPath: /app/data
      Antivirus__Host: clamav
      Antivirus__Port: "3310"
    ports:
      - "7081:8080"
    volumes:
      - local-files:/app/data
    depends_on:
      sql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      clamav:
        condition: service_started

  demo:
    build:
      context: .
      dockerfile: DemoApp/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DisableHttpsRedirection: "true"
      ApiBaseUrl: http://api:8080/
      CertificateMode: Local
    ports:
      - "7082:8080"
    depends_on:
      - api

  notification:
    build:
      context: .
      dockerfile: NotificationService/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Server=sql;Database=DCP_Local;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
    depends_on:
      sql:
        condition: service_healthy
      rabbitmq:
        condition: service_started

volumes:
  sql-local-data:
  local-files:
